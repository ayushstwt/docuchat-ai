name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Tests & Quality Gate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: docuchat_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backend Pytest Suite
        working-directory: backend
        env:
          APP_ENV: local
          DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@localhost:5432/docuchat_test_db
          JWT_SECRET: test_jwt_secret_key_minimum_32_characters_for_ci_pipeline
          JWT_ACCESS_MINUTES: 60
          JWT_REFRESH_DAYS: 7
          AZURE_OPENAI_ENDPOINT: https://mock-azure-openai.openai.azure.com/
          AZURE_OPENAI_API_KEY: mock_azure_openai_api_key_ci
          AZURE_OPENAI_API_VERSION: "2024-02-01"
          AZURE_OPENAI_CHAT_DEPLOYMENT: gpt-4o
          AZURE_OPENAI_EMBEDDING_DEPLOYMENT: text-embedding-3-small
          EMBEDDING_DIMENSIONS: 1536
          UPLOAD_DIR: uploads
          MAX_UPLOAD_MB: 20
          CORS_ORIGINS: http://localhost:5173
        run: |
          python -m pytest -q

  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck / Lint
        working-directory: frontend
        run: npm run lint

      - name: Build production bundle
        working-directory: frontend
        env:
          VITE_API_BASE_URL: /api/v1
        run: npm run build

  compose-validation:
    name: Validate Compose Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate compose files
        run: |
          for e in dev staging prod; do
            cp deploy/env/$e.env.example deploy/env/$e.env
            profile=""; [ "$e" != "dev" ] && profile="--profile edge"
            docker compose --env-file deploy/env/$e.env $profile \
              -f deploy/docker-compose.yml -f deploy/docker-compose.$e.yml config -q
          done
